# 练习用 workflow：注释全部单独成行，不跟在 key 后面
# 只保留手动触发，用来学习，不会被 cron-job 或定时自动触发

# workflow 显示的名字
name: LearnTest

# 什么时候开工
on:
  # 触发器：仅手动，在 Actions 页面点 Run workflow
  workflow_dispatch:

# 开工后干哪些活
jobs:
  # job 名字
  learn:
    # 用哪种临时机器
    runs-on: ubuntu-latest

    # 一步一步的动作
    steps:
      # 步骤1：打印一句话
      - name: Say hello
        run: echo "Hello GitHub Actions, 我学会了！"

      # 步骤2：显示当前时间和系统信息
      - name: Show info
        run: |
          echo "现在时间：$(date)"
          echo "系统信息："
          uname -a
